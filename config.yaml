# Power is in watts; samples and durations are in minutes.
seed: 42
days: 5
minutes_per_day: 1440
noise_w: 50

channels:
  - name: motor
    type: markov
    levels_w: [0, 500, 3000]
    dwell_minutes: [40, 5, 15]

  - name: pump
    type: markov
    levels_w: [0, 1500]
    dwell_minutes: [60, 10]

  - name: lighting
    type: schedule
    levels_w: [0, 4000]
    switch_minutes: [390, 1170]
    states: [1, 0, 1]
    jitter_minutes: 20
    support_order: [1, 0, 1]  # optional rule for --restricted

background:
  range_w: [1000, 3000]
  hold_minutes: [10, 60]

decoder:
  grid_step_w: 250
  step_scale_w: 125
